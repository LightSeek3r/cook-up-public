name: monitor

# Read-only hourly uptime check: home, glossary and one API answer 200 and
# every chunk the pages reference loads (no browser, no /api/track). Needs no
# secrets. GitHub may delay scheduled runs, and disables them after 60 days
# without repository activity.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.COOKUP_URL || 'https://cook-up.asakura-account.workers.dev' }}

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # /api/ingredients is edge-cached per colo, so this costs D1 rows only on
      # a cache miss. --no-headers: main may be ahead of what is deployed.
      - name: Pages, API and chunk graph
        run: node scripts/verify-deploy.mjs "$SITE_URL" --page=/ --page=/glossary --api=/api/ingredients?lang=en --no-headers

      - name: Open or update the outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site check failing $(date -u +%F)"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$SITE_URL failed the uptime check: $RUN_URL"
          else
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          fi
