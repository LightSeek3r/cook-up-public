name: deploy

# Manual (Actions > deploy > Run workflow, on main) or a v* tag. Either way the
# job waits for a reviewer on the `production` environment, and refuses while
# remote D1 has pending migrations: applying them stays a human step
# (`npm run db:migrate:remote`), because they cost daily D1 quota and remote
# content cannot be regenerated. See README, "Deploying".
on:
  workflow_dispatch:
    inputs:
      fresh_cache:
        description: New API cache keys although the commit is unchanged (after a reseed or translation batch)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://cook-up.asakura-account.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require the production secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the production environment (README, CI and secrets)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache in the job that holds the deploy token.
          package-manager-cache: false

      - run: npm ci

      - name: Install Chromium for the post-deploy hydration check
        run: npx playwright install --with-deps chromium

      # Migration gate, checked build, wrangler deploy with retry, live chunk +
      # header + API check, browser hydration check. Stops at the first failure.
      - name: Deploy
        run: node scripts/deploy.mjs ${{ inputs.fresh_cache && '--fresh-cache' || '' }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-build-log-${{ github.run_id }}
          path: .wrangler/deploy/build.log
          if-no-files-found: ignore
          retention-days: 30
