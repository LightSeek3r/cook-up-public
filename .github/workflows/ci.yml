name: ci

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs this whole workflow first and deploys only if it passes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The migration check diffs against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The data artefacts are a release asset of the public data repository,
      # pinned by src/lib/data/lock.json; the build refuses to run without
      # them and the tests check them against their manifest and budgets.
      - name: Data artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run data:fetch

      - name: Line endings are LF in the index
        run: node scripts/check-line-endings.mjs

      - name: Migrations are numbered in order and append-only
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'origin/main' }}
        run: node scripts/check-migrations.mjs

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build (fails unless the adapter finished and server and assets match)
        run: npm run build:checked

      - name: Worker bundle size
        # Cloudflare's hard limit is 64 MiB uncompressed with no gzip limit;
        # these are early-warning budgets (see the script header).
        env:
          BUDGET_RAW_KIB: 16384
          BUDGET_GZIP_KIB: 2560
        run: npm run check:bundle

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke tests against wrangler dev --local on the fixture D1
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .wrangler/deploy/build.log
          if-no-files-found: ignore
          retention-days: 7
