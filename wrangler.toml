name = "cook-up"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "nodejs_als"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "cook-up-db"
database_id = "d280f0fa-a98a-42aa-9477-c1294322b207"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "4273e964f2cf4404938badb8c1b03248"

# Workers AI has no local emulation, so this binding is always proxied to the
# remote account. `vite dev` therefore requires `npx wrangler login`; D1 and KV
# stay local. Comment this block out to work fully offline — /api/translate then
# returns a clear 500 ("Workers AI binding is not configured").
#[ai]
#binding = "AI"
#remote = true
