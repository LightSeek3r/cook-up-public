<!doctype html>
<html lang="%cookup.lang%" dir="%cookup.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />

		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Media-scoped so they are correct until a theme is chosen (the OS
		     decides) and with no JavaScript at all. ThemeToggle repoints both at
		     one palette once a theme is chosen, using the data-* colours below. -->
		<meta
			name="theme-color"
			content="#ecedee"
			media="(prefers-color-scheme: light)"
			data-light="#ecedee"
			data-dark="#14171b"
		/>
		<meta
			name="theme-color"
			content="#14171b"
			media="(prefers-color-scheme: dark)"
			data-light="#ecedee"
			data-dark="#14171b"
		/>

		<!-- Applies a stored theme override before first paint, so a user who chose
		     the palette opposite their OS never sees a flash of the other one. Lives
		     in a same-origin file rather than inline: a strict script-src CSP has no
		     way to allow-list an inline script that's already static HTML text (the
		     hash SvelteKit computes under kit.csp only covers scripts it generates
		     itself, not this template's own markup) — 'self' covers an external file
		     with no hash to keep in sync. It cannot import from $lib (it runs before
		     any module), so the two valid values and the storage key are repeated as
		     literals in static/theme-init.js — theme-css.test.mjs asserts they still
		     match THEMES and THEME_KEY. -->
		<script src="/theme-init.js"></script>

		%sveltekit.head%

		<!-- After the stylesheets on purpose (see static/font-init.js); same
		     external-file reasoning as theme-init.js. -->
		<script src="/font-init.js"></script>
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
